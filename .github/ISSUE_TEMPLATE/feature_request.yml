name: Feature request
description: Propose a focused improvement to Love+
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the smallest useful solution and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Explain whether this touches authentication, pairing, sessions, realtime data, notifications, location, diagnostics, or retention.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Mention migrations, API contracts, mobile changes, tests, or docs that may be required.
