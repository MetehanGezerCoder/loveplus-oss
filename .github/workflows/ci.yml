name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    env:
      LOVEPLUS_TEST_POSTGRES: Host=localhost;Port=5432;Database=loveplus_tests;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loveplus_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loveplus_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LovePlus.slnx
      - name: Build
        run: dotnet build LovePlus.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test LovePlus.slnx --no-build --configuration Release

  mobile:
    name: Mobile typecheck, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --runInBand
