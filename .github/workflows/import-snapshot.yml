name: Import sanitized Love+ snapshot

on:
  push:
    branches: [import-sanitized-snapshot]
    paths:
      - oss-import/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify sanitized snapshot
        shell: bash
        run: |
          test -f oss-import/READY
          SNAPSHOT_URL="$(base64 --decode oss-import/URL.b64)"
          SNAPSHOT_SHA256="$(tr -d '\r\n' < oss-import/SHA256)"
          curl --fail --location --silent --show-error "$SNAPSHOT_URL" --output /tmp/loveplus-snapshot.zip
          mkdir -p /tmp/loveplus-artifact
          unzip -q /tmp/loveplus-snapshot.zip -d /tmp/loveplus-artifact
          ARCHIVE=/tmp/loveplus-artifact/loveplus-oss.tar.gz
          test -f "$ARCHIVE"
          echo "$SNAPSHOT_SHA256  $ARCHIVE" | sha256sum --check --strict

          python3 - <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path('/tmp/loveplus-artifact/loveplus-oss.tar.gz')
          root = pathlib.Path('.').resolve()
          with tarfile.open(archive, 'r:gz') as tf:
              for member in tf.getmembers():
                  target = (root / member.name).resolve()
                  if root not in target.parents and target != root:
                      raise SystemExit(f'Unsafe archive path: {member.name}')
              tf.extractall(root)
          PY

      - name: Commit restored snapshot
        shell: bash
        run: |
          rm -rf oss-import
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import sanitized Love+ OSS snapshot"
          git push
