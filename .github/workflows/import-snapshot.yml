name: Import sanitized Love+ snapshot

on:
  push:
    branches: [import-sanitized-snapshot]
    paths:
      - oss-import/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore sanitized archive
        shell: bash
        run: |
          if [ ! -f oss-import/READY ]; then
            echo "READY marker is absent; nothing to import."
            exit 0
          fi
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, tarfile, tempfile

          import_dir = pathlib.Path('oss-import')
          metadata = json.loads((import_dir / 'METADATA.json').read_text(encoding='utf-8'))
          chunks = sorted(import_dir.glob('archive-*.txt'))
          if len(chunks) != metadata['chunk_count']:
              raise SystemExit(f"Expected {metadata['chunk_count']} chunks, found {len(chunks)}")

          encoded = ''.join(p.read_text(encoding='ascii') for p in chunks)
          archive_bytes = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(archive_bytes).hexdigest()
          if digest != metadata['archive_sha256']:
              raise SystemExit(f"Archive SHA-256 mismatch: {digest}")

          with tempfile.NamedTemporaryFile(suffix='.tar.gz') as archive:
              archive.write(archive_bytes)
              archive.flush()
              with tarfile.open(archive.name, 'r:gz') as tf:
                  for member in tf.getmembers():
                      target = (pathlib.Path('.') / member.name).resolve()
                      root = pathlib.Path('.').resolve()
                      if root not in target.parents and target != root:
                          raise SystemExit(f"Unsafe archive path: {member.name}")
                  tf.extractall('.')

          print(f"restored {metadata['file_count']} sanitized files; sha256={digest}")
          PY

      - name: Commit restored snapshot
        shell: bash
        run: |
          rm -rf oss-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import sanitized Love+ OSS snapshot"
          git push
